[editor]
wordwrap=true
border_size=20
border_color=#313244
background_color=#1e1e2e
gutter_background_color=#313244
current_line_color=#313244
line_number_color=#6c7086
text_color=#cdd6f4
block_cursor=true
block_cursor_blink=false
font_family=Monaco
font_size=18
line_height=1.4
pixels_above=0
pixels_below=0
line_distance=0
show_line_numbers=false
highlight_current_line=true
show_statusbar=false

[shortcuts]
new_file=<Primary>n
open=<Primary>o
save=<Primary>s
save_as=<Primary><Shift>s
quit=<Primary>q
undo=<Primary>z
redo=<Primary>y
cut=<Primary>x
copy=<Primary>c
paste=<Primary>v
find=<Primary>f
find_next=F3
goto_line=<Primary>g
reload_config=<Primary>r
toggle_wordwrap=<Primary>w
increase_font=<Primary>plus
decrease_font=<Primary>minus
fullscreen=F11
toggle_line_numbers=<Primary>l
toggle_current_line=<Primary>h
toggle_statusbar=<Primary><Shift>b
